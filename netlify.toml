# Netlify deploys the frontend as a fully static site — no Python backend runs here.
#
# That works because every FastAPI route is a passthrough of one JSON file, so
# `npm run build:static` copies backend/data/processed/api/*.json into the bundle
# and VITE_STATIC_API=1 makes the client read those files instead of calling a
# server. See frontend/src/api.js.
#
# Prerequisite: the payloads must exist before you push — run `python -m pipeline.run`
# in backend/ and commit backend/data/processed/api/*.json (they are ~1.1 MB total).

[build]
  base = "frontend"
  command = "npm run build:static"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# VITE_STATIC_API is not set here on purpose: `build:static` runs
# `vite build --mode static`, which loads frontend/.env.static. Keeping the flag in
# one place means a local `npm run build:static` produces exactly what Netlify does,
# instead of silently building a backend-dependent bundle.

# The app uses hash routing (#/crime), so no SPA rewrite is needed — every URL
# already resolves to index.html on its own.

# The API payloads are content-hashed by the pipeline run, not by Vite, so keep
# them revalidating rather than immutably cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
